name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验版本号一致性
        run: pnpm version:check

      - name: 类型检查与单元测试
        run: |
          pnpm --filter @inkline/desktop lint
          pnpm --filter @inkline/desktop test

      - name: 桌面端 Rust 测试
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: 构建未签名安装包
        run: pnpm tauri build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: inkline-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  team-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inkline_test
          POSTGRES_USER: inkline
          POSTGRES_PASSWORD: inkline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inkline -d inkline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/team-server -> target"

      - name: 单元与集成测试
        env:
          TEST_DATABASE_URL: postgres://inkline:inkline@localhost:5432/inkline_test
        run: cargo test --manifest-path apps/team-server/Cargo.toml

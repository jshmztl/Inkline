name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 校验标签与版本一致
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          if ("v$version" -ne "$env:GITHUB_REF_NAME") {
            throw "标签 $env:GITHUB_REF_NAME 与 tauri.conf.json 版本 v$version 不一致"
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查与测试
        run: |
          pnpm --filter @inkline/desktop lint
          pnpm --filter @inkline/desktop test

      - name: 准备 Windows 代码签名证书
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Host '未配置 WINDOWS_CERTIFICATE_BASE64，本次构建不进行 Windows 代码签名'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'inkline-codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "INKLINE_SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INKLINE_SIGN_PFX_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INKLINE_SIGN_DESCRIPTION=Inkline" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host '已准备代码签名证书'

      - name: 构建签名安装包
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATE_BASE_URL: ${{ format('https://github.com/{0}/releases/latest/download', github.repository) }}
          UPDATE_ASSET_NAME: inkline_x64-setup.exe
        run: pnpm release

      - name: 校验安装包签名
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:INKLINE_SIGN_PFX)) {
            Write-Host '未配置代码签名证书，跳过签名校验'
            exit 0
          }
          $bundle = 'apps/desktop/src-tauri/target/release/bundle'
          $installer = Get-ChildItem "$bundle/nsis/*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw '未找到 NSIS 安装包' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if (-not $signature.SignerCertificate) { throw "安装包未签名：$($installer.FullName)" }
          Write-Host "签名状态：$($signature.Status)"
          Write-Host "签名者：$($signature.SignerCertificate.Subject)"

      - name: 整理发布产物
        shell: pwsh
        run: |
          $bundle = 'apps/desktop/src-tauri/target/release/bundle'
          $installer = Get-ChildItem "$bundle/nsis/*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw '未找到 NSIS 安装包' }
          Copy-Item $installer.FullName "$bundle/inkline_x64-setup.exe" -Force
          Get-ChildItem $bundle -File | Where-Object { $_.Name -match '\.(exe|msi|sig|json)$' } | Select-Object Name, Length

      - name: 发布 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundle = 'apps/desktop/src-tauri/target/release/bundle'
          gh release create $env:GITHUB_REF_NAME `
            "$bundle/inkline_x64-setup.exe" `
            "$bundle/latest.json" `
            --title "Inkline $env:GITHUB_REF_NAME" `
            --notes "Inkline $env:GITHUB_REF_NAME"

[package]
name = "api-workbench"
version = "0.1.6"
description = "Offline-first API workbench"
authors = ["API Workbench"]
edition = "2021"

[lib]
name = "api_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
base64 = "0.22"
tokio = { version = "1", features = ["sync", "macros", "net", "io-util", "time", "rt", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[package]
name = "inkline"
version = "0.1.22"
description = "Inkline · 内网 API 工作台"
authors = ["Inkline"]
edition = "2021"

[lib]
name = "inkline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream", "cookies"] }
base64 = "0.22"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tokio-rustls = "0.26"
tokio = { version = "1", features = ["sync", "macros", "net", "io-util", "time", "rt", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
if-addrs = "0.13"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
keyring = { version = "3", features = ["windows-native"] }

[package]
name = "inkline-team-server"
version = "0.1.0"
edition = "2021"
description = "Inkline 团队同步服务（M1）"
license = "AGPL-3.0-or-later"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "cors"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "migrate",
  "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

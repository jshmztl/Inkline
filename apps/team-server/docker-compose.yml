services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inkline_team
      POSTGRES_USER: inkline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkline -d inkline_team"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://inkline:${POSTGRES_PASSWORD:-change-me}@db:5432/inkline_team
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-random-characters}
      BIND_ADDR: 0.0.0.0:8080
      BOOTSTRAP_ACCOUNT: ${BOOTSTRAP_ACCOUNT:-admin}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-change-me-please}
      DEFAULT_SNAPSHOT_RETENTION_DAYS: ${DEFAULT_SNAPSHOT_RETENTION_DAYS:-90}
      DEFAULT_AUDIT_RETENTION_DAYS: ${DEFAULT_AUDIT_RETENTION_DAYS:-90}
    ports:
      - "8080:8080"

volumes:
  pgdata:

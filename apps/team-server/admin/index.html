<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inkline 团队管理台</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #2f5bea;
      --accent-soft: #eef2ff;
      --ok: #0f9d58;
      --warn: #b45309;
      --danger: #dc2626;
      --radius: 14px;
      --shadow: 0 8px 24px rgba(15, 23, 42, .06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    code, .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }

    /* 登录 */
    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(900px 500px at 15% 10%, #dfe7ff 0, transparent 60%),
        radial-gradient(700px 500px at 85% 90%, #e8f7ef 0, transparent 55%),
        var(--bg);
    }
    .login-card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, .12);
    }
    .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .logo {
      width: 42px; height: 42px; border-radius: 12px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #1e3a8a, #2f5bea);
      color: #fff; font-weight: 700; font-size: 18px;
    }
    .login-brand strong { display: block; font-size: 17px; }
    .login-brand small { color: var(--muted); }
    .login-card h1 { font-size: 22px; margin: 0 0 6px; }
    .login-card > p { margin: 0 0 20px; color: var(--muted); }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 13px; color: #334155; }
    .field input, .field select {
      height: 40px; border: 1px solid var(--line); border-radius: 10px;
      padding: 0 12px; background: #fff; color: var(--ink); outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .btn {
      height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { border-color: #cbd5e1; background: #f8fafc; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: #244bd0; }
    .btn.small { height: 30px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .login-submit { width: 100%; height: 42px; margin-top: 4px; }
    .login-error { color: var(--danger); min-height: 20px; font-size: 13px; margin: 2px 0 8px; }
    .login-foot { margin-top: 16px; color: var(--muted); font-size: 12px; text-align: center; }

    /* 应用框架 */
    .topbar {
      height: 60px; background: #0b1220; color: #e2e8f0;
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
      position: sticky; top: 0; z-index: 10;
    }
    .topbar .brand { display: flex; align-items: center; gap: 10px; }
    .topbar .logo { width: 34px; height: 34px; border-radius: 10px; font-size: 14px; }
    .topbar .brand strong { display: block; font-size: 15px; color: #fff; }
    .topbar .brand small { color: #94a3b8; font-size: 11px; }
    .top-actions { display: flex; align-items: center; gap: 12px; font-size: 12px; }
    .top-actions .server { color: #94a3b8; }
    .top-actions button { height: 30px; border-radius: 8px; border: 1px solid #334155; background: #111c30; color: #e2e8f0; padding: 0 10px; }
    .top-actions button:hover { background: #1e293b; }
    .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 60px); }
    .sidebar { background: #fff; border-right: 1px solid var(--line); padding: 16px 12px; }
    .side-head { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 10px; }
    .side-head span { font-weight: 600; }
    .team-list { display: flex; flex-direction: column; gap: 6px; }
    .team-item {
      text-align: left; border: 1px solid transparent; background: transparent;
      border-radius: 10px; padding: 9px 10px; display: flex; flex-direction: column; gap: 2px;
    }
    .team-item strong { font-size: 13px; font-weight: 600; color: var(--ink); }
    .team-item span { font-size: 11px; }
    .team-item:hover { background: #f8fafc; }
    .team-item.active { background: var(--accent-soft); border-color: #c7d2fe; }
    .side-empty { padding: 8px 10px; font-size: 12px; }
    .main { padding: 24px; min-width: 0; }
    .empty { height: 60vh; display: grid; place-items: center; color: var(--muted); }
    .page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .page-head h1 { margin: 0; font-size: 24px; }
    .pill { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; background: #f1f5f9; color: #475569; }
    .pill.accent { background: var(--accent-soft); color: #1d4ed8; }
    .pill.ok { background: #e8f7ef; color: #0f7a46; }
    .pill.warn { background: #fff7ed; color: var(--warn); }
    .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
    .stat-label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .stat-value { font-size: 20px; letter-spacing: -.01em; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
    .tabs button {
      border: 0; background: transparent; padding: 10px 14px; color: var(--muted);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .card h3 { margin: 0; font-size: 15px; }
    .kv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; margin: 14px 0 16px; }
    .kv label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
    .kv strong { font-weight: 600; word-break: break-all; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    table.table { width: 100%; border-collapse: collapse; min-width: 640px; }
    .table th, .table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eef2f7; font-size: 13px; vertical-align: middle; }
    .table th { background: #f8fafc; color: var(--muted); font-weight: 500; font-size: 12px; }
    .table tr:last-child td { border-bottom: 0; }
    .settings-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; max-width: 720px; }
    .settings-form .wide { grid-column: 1 / -1; }
    .section-note { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
    .toast {
      position: fixed; right: 20px; bottom: 20px; z-index: 50;
      background: #0f172a; color: #fff; padding: 10px 14px; border-radius: 10px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, .25); font-size: 13px; max-width: 380px;
    }
    .toast.error { background: #991b1b; }
    dialog {
      border: 0; border-radius: 16px; padding: 0; width: min(860px, calc(100vw - 32px));
      box-shadow: 0 30px 80px rgba(15, 23, 42, .3);
    }
    dialog::backdrop { background: rgba(15, 23, 42, .45); }
    .dialog-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { margin: 0; font-size: 16px; }
    .dialog-body { padding: 16px 18px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 18px 16px; }
    dialog pre { margin: 0; padding: 16px 18px; max-height: 60vh; overflow: auto; background: #0b1220; color: #dbeafe; font-size: 12px; }
    #team-dialog { width: min(420px, calc(100vw - 32px)); }
    @media (max-width: 1100px) {
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .team-list { flex-direction: row; overflow-x: auto; }
      .team-item { min-width: 150px; }
      .main { padding: 16px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .kv-grid { grid-template-columns: 1fr; }
      .settings-form { grid-template-columns: 1fr; }
      .top-actions .server, .top-actions #user-label { display: none; }
    }
  </style>
</head>
<body>
  <div id="login" class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <div class="logo">墨</div>
        <div>
          <strong>Inkline 团队管理台</strong>
          <small id="login-meta">团队同步服务</small>
        </div>
      </div>
      <h1>登录管理台</h1>
      <p>使用团队服务账号登录，管理团队、快照与审计记录。</p>
      <form id="login-form">
        <div class="field">
          <label for="account">账号</label>
          <input id="account" autocomplete="username" placeholder="例如 admin" required>
        </div>
        <div class="field">
          <label for="password">口令</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="请输入口令" required>
        </div>
        <div id="login-error" class="login-error"></div>
        <button id="login-submit" class="btn primary login-submit" type="submit">登录</button>
      </form>
      <div class="login-foot" id="login-foot"></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">
        <div class="logo">墨</div>
        <div>
          <strong>Inkline 团队管理台</strong>
          <small>Team workspace console</small>
        </div>
      </div>
      <div class="top-actions">
        <span class="server" id="server-meta"></span>
        <span id="user-label"></span>
        <button id="refresh" type="button">刷新</button>
        <button id="logout" type="button">退出</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="side-head">
          <span>团队</span>
          <button id="new-team" class="btn small" type="button">+ 新建</button>
        </div>
        <div id="team-list" class="team-list"></div>
      </aside>

      <main class="main">
        <div id="empty" class="empty">选择或创建一个团队</div>
        <div id="team-view" class="hidden">
          <div class="page-head">
            <h1 id="team-name"></h1>
            <span id="team-role" class="pill"></span>
          </div>
          <section id="stats" class="stats"></section>

          <nav class="tabs" id="tabs">
            <button type="button" data-tab="overview" class="active">概览</button>
            <button type="button" data-tab="snapshots">快照历史</button>
            <button type="button" data-tab="members">成员</button>
            <button type="button" data-tab="audit">审计</button>
          </nav>

          <section id="tab-overview" class="tab"></section>
          <section id="tab-snapshots" class="tab hidden"></section>
          <section id="tab-members" class="tab hidden"></section>
          <section id="tab-audit" class="tab hidden"></section>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <dialog id="payload-dialog">
    <div class="dialog-head">
      <h2 id="payload-title">快照内容</h2>
      <button id="payload-close" class="btn small" type="button">关闭</button>
    </div>
    <pre id="payload-body"></pre>
  </dialog>

  <dialog id="team-dialog">
    <form id="team-form">
      <div class="dialog-head">
        <h2>新建团队</h2>
      </div>
      <div class="dialog-body">
        <div class="field">
          <label for="new-team-name">团队名称</label>
          <input id="new-team-name" maxlength="80" placeholder="例如：支付中台" required>
        </div>
        <p class="section-note">创建后你将自动成为团队所有者。</p>
      </div>
      <div class="dialog-actions">
        <button id="team-cancel" class="btn" type="button">取消</button>
        <button class="btn primary" type="submit">创建</button>
      </div>
    </form>
  </dialog>

  <script>
    (() => {
      const TOKEN_KEY = 'inkline_admin_access';
      const REFRESH_KEY = 'inkline_admin_refresh';
      const TEAM_KEY = 'inkline_admin_team';

      const $ = (sel) => document.querySelector(sel);
      const loginPage = $('#login');
      const app = $('#app');
      const teamList = $('#team-list');
      const empty = $('#empty');
      const teamView = $('#team-view');
      const toast = $('#toast');
      const payloadDialog = $('#payload-dialog');
      const payloadBody = $('#payload-body');
      const payloadTitle = $('#payload-title');
      const teamDialog = $('#team-dialog');

      const state = {
        access: '',
        refresh: '',
        me: null,
        teams: [],
        team: null,
        members: [],
        latest: null,
        history: [],
        historyCursor: null,
        audit: null,
        tab: 'overview',
      };

      const roleLabels = { owner: '所有者', admin: '管理员', member: '成员', viewer: '只读' };

      function h(tag, props = {}, ...children) {
        const el = document.createElement(tag);
        for (const [key, value] of Object.entries(props)) {
          if (value === null || value === undefined || value === false) continue;
          if (key === 'class') el.className = value;
          else if (key === 'text') el.textContent = value;
          else if (key.startsWith('on') && typeof value === 'function') {
            el.addEventListener(key.slice(2).toLowerCase(), value);
          } else {
            el.setAttribute(key, value === true ? '' : String(value));
          }
        }
        for (const child of children.flat(Infinity)) {
          if (child === null || child === undefined || child === false) continue;
          el.append(child instanceof Node ? child : document.createTextNode(String(child)));
        }
        return el;
      }

      function showToast(message, tone = 'ok') {
        toast.textContent = message;
        toast.className = 'toast' + (tone === 'error' ? ' error' : '');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.add('hidden'), 3200);
      }

      function fmtTime(value) {
        if (!value) return '-';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleString('zh-CN', { hour12: false });
      }

      function fmtBytes(value) {
        if (value === null || value === undefined) return '-';
        const units = ['B', 'KB', 'MB', 'GB'];
        let size = Number(value);
        let index = 0;
        while (size >= 1024 && index < units.length - 1) {
          size /= 1024;
          index += 1;
        }
        return (index === 0 ? size : size.toFixed(1)) + ' ' + units[index];
      }

      function shortHash(hash) {
        if (!hash) return '-';
        return hash.length > 22 ? hash.slice(0, 18) + '…' : hash;
      }

      function saveTokens() {
        sessionStorage.setItem(TOKEN_KEY, state.access);
        sessionStorage.setItem(REFRESH_KEY, state.refresh);
      }

      function clearSession() {
        state.access = '';
        state.refresh = '';
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(REFRESH_KEY);
      }

      function loadTokens() {
        state.access = sessionStorage.getItem(TOKEN_KEY) || '';
        state.refresh = sessionStorage.getItem(REFRESH_KEY) || '';
      }

      async function refreshSession() {
        if (!state.refresh) throw new Error('登录已过期');
        const response = await fetch('/v1/auth/refresh', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refreshToken: state.refresh }),
        });
        if (!response.ok) throw new Error('登录已过期');
        const data = await response.json();
        state.access = data.accessToken;
        state.refresh = data.refreshToken;
        saveTokens();
      }

      async function authorizedFetch(path, options = {}, retry = true) {
        const headers = new Headers(options.headers || {});
        if (options.body && !headers.has('Content-Type')) {
          headers.set('Content-Type', 'application/json');
        }
        if (state.access) headers.set('Authorization', 'Bearer ' + state.access);
        const response = await fetch(path, { ...options, headers });
        if (response.status === 401 && retry && state.refresh) {
          try {
            await refreshSession();
            return authorizedFetch(path, options, false);
          } catch {
            clearSession();
          }
        }
        return response;
      }

      async function api(path, options = {}) {
        const response = await authorizedFetch(path, options);
        if (response.status === 204) return null;
        const text = await response.text();
        let data = null;
        try {
          data = text ? JSON.parse(text) : null;
        } catch {
          data = text;
        }
        if (!response.ok) {
          const error = new Error(data?.error?.message || data?.message || `请求失败（${response.status}）`);
          error.code = data?.error?.code;
          error.status = response.status;
          if (response.status === 401) {
            clearSession();
            showLogin();
          }
          throw error;
        }
        return data;
      }

      function showLogin() {
        loginPage.classList.remove('hidden');
        app.classList.add('hidden');
      }

      function showApp() {
        loginPage.classList.add('hidden');
        app.classList.remove('hidden');
      }

      function rolePill(role) {
        const tone = role === 'owner' ? 'accent' : role === 'admin' ? 'ok' : '';
        return h('span', { class: 'pill ' + tone, text: roleLabels[role] || role || '-' });
      }

      function renderTeamList() {
        teamList.replaceChildren();
        if (!state.teams.length) {
          teamList.append(h('p', { class: 'muted side-empty', text: '还没有团队' }));
          return;
        }
        for (const team of state.teams) {
          const active = state.team && state.team.id === team.id;
          const item = h('button', { class: 'team-item' + (active ? ' active' : ''), type: 'button' },
            h('strong', { text: team.name }),
            h('span', {
              class: 'muted',
              text: `${roleLabels[team.role] || team.role} · #${team.revision} · ${team.memberCount} 人`,
            }),
          );
          item.addEventListener('click', () => selectTeam(team.id));
          teamList.append(item);
        }
      }

      function stat(label, value) {
        return h('div', { class: 'stat' },
          h('span', { class: 'stat-label', text: label }),
          h('strong', { class: 'stat-value', text: String(value) }),
        );
      }

      function renderStats(team) {
        $('#stats').replaceChildren(
          stat('当前版本', '#' + team.revision),
          stat('数据分级上限', team.maxDataLevel),
          stat('快照保留', team.snapshotRetentionDays + ' 天'),
          stat('审计保留', team.auditRetentionDays + ' 天'),
          stat('成员数', team.memberCount),
        );
      }

      function kv(label, value) {
        const strong = typeof value === 'string'
          ? h('strong', { text: value })
          : h('strong', {}, value);
        return h('div', { class: 'kv' }, h('label', { text: label }), strong);
      }

      function snapshotCard(team) {
        const card = h('div', { class: 'card' });
        card.append(h('div', { class: 'card-head' },
          h('h3', { text: '最新快照' }),
          state.latest ? h('span', { class: 'pill ok', text: '#' + state.latest.revision }) : h('span', { class: 'pill', text: '暂无' }),
        ));

        if (!state.latest) {
          card.append(h('p', { class: 'section-note', text: '团队还没有推送过快照。客户端完成一次 push 后会出现在这里。' }));
          return card;
        }

        card.append(h('div', { class: 'kv-grid' },
          kv('上传者', state.latest.createdBy?.displayName || '-'),
          kv('时间', fmtTime(state.latest.createdAt)),
          kv('大小', fmtBytes(state.latest.sizeBytes)),
          kv('Hash', h('code', { text: shortHash(state.latest.hash) })),
        ));

        const view = h('button', { class: 'btn small', type: 'button', text: '查看内容' });
        view.addEventListener('click', () => openPayload(state.latest.revision));
        const download = h('button', { class: 'btn small', type: 'button', text: '下载 JSON' });
        download.addEventListener('click', () => downloadSnapshot(state.latest.revision));
        card.append(h('div', { class: 'actions' }, view, download));
        return card;
      }

      function settingsCard(team) {
        const card = h('div', { class: 'card' });
        card.append(h('div', { class: 'card-head' }, h('h3', { text: '团队设置' })));

        if (team.role !== 'owner') {
          card.append(h('p', { class: 'section-note', text: '只有团队所有者可以修改名称、数据分级与保留策略。' }));
          return card;
        }

        const name = h('input', { value: team.name, maxlength: '80', required: true });
        const level = h('select', {},
          ...['L0', 'L1', 'L2'].map((value) => h('option', { value, text: value, selected: value === team.maxDataLevel })),
        );
        const snapshotDays = h('input', { type: 'number', min: '7', max: '3650', value: team.snapshotRetentionDays, required: true });
        const auditDays = h('input', { type: 'number', min: '7', max: '3650', value: team.auditRetentionDays, required: true });

        const form = h('form', { class: 'settings-form' },
          h('div', { class: 'field wide' }, h('label', { text: '团队名称' }), name),
          h('div', { class: 'field' }, h('label', { text: '数据分级上限' }), level),
          h('div', { class: 'field' }, h('label', { text: '快照保留天数' }), snapshotDays),
          h('div', { class: 'field' }, h('label', { text: '审计保留天数' }), auditDays),
          h('div', { class: 'wide actions' }, h('button', { class: 'btn primary', type: 'submit', text: '保存设置' })),
        );

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const button = form.querySelector('button[type="submit"]');
          button.disabled = true;
          try {
            const result = await api(`/v1/teams/${team.id}`, {
              method: 'PATCH',
              body: JSON.stringify({
                name: name.value.trim(),
                maxDataLevel: level.value,
                snapshotRetentionDays: Number(snapshotDays.value),
                auditRetentionDays: Number(auditDays.value),
              }),
            });
            state.team = { ...state.team, ...result.team };
            const index = state.teams.findIndex((item) => item.id === state.team.id);
            if (index >= 0) state.teams[index] = { ...state.teams[index], ...result.team };
            renderTeamList();
            renderTeam();
            showToast('团队设置已保存');
          } catch (error) {
            showToast(error.message, 'error');
          } finally {
            button.disabled = false;
          }
        });

        card.append(form);
        card.append(h('p', { class: 'section-note', text: 'L3 数据禁止进入团队服务；保留天数范围 7–3650 天。' }));
        return card;
      }

      function renderOverview(team) {
        $('#tab-overview').replaceChildren(snapshotCard(team), settingsCard(team));
      }

      function renderSnapshots() {
        const container = $('#tab-snapshots');
        const card = h('div', { class: 'card' });
        card.append(h('div', { class: 'card-head' },
          h('h3', { text: '快照历史' }),
          h('span', { class: 'muted', text: state.history.length ? `已加载 ${state.history.length} 条` : '' }),
        ));

        if (!state.history.length) {
          card.append(h('p', { class: 'section-note', text: '暂无快照。' }));
          container.replaceChildren(card);
          return;
        }

        const rows = state.history.map((entry) => {
          const view = h('button', { class: 'btn small', type: 'button', text: '查看' });
          view.addEventListener('click', () => openPayload(entry.revision));
          const download = h('button', { class: 'btn small', type: 'button', text: '下载' });
          download.addEventListener('click', () => downloadSnapshot(entry.revision));
          return h('tr', {},
            h('td', {}, h('strong', { text: '#' + entry.revision })),
            h('td', { text: fmtTime(entry.createdAt) }),
            h('td', { text: entry.createdBy?.displayName || '-' }),
            h('td', { text: fmtBytes(entry.sizeBytes) }),
            h('td', { text: entry.baseRevision === null || entry.baseRevision === undefined ? '-' : '#' + entry.baseRevision }),
            h('td', {}, h('code', { text: shortHash(entry.hash) })),
            h('td', {}, h('div', { class: 'actions' }, view, download)),
          );
        });

        const table = h('div', { class: 'table-wrap' },
          h('table', { class: 'table' },
            h('thead', {}, h('tr', {},
              ...['版本', '时间', '上传者', '大小', '基础版本', 'Hash', '操作'].map((text) => h('th', { text })),
            )),
            h('tbody', {}, ...rows),
          ),
        );
        card.append(table);

        if (state.historyCursor) {
          const more = h('button', { class: 'btn', type: 'button', text: '加载更多' });
          more.addEventListener('click', loadMoreHistory);
          card.append(h('div', { class: 'actions', style: 'margin-top:12px' }, more));
        }
        container.replaceChildren(card);
      }

      async function loadMoreHistory() {
        try {
          const page = await api(`/v1/teams/${state.team.id}/snapshots?limit=20&before=${state.historyCursor}`);
          state.history = state.history.concat(page.entries || []);
          state.historyCursor = page.nextCursor;
          renderSnapshots();
        } catch (error) {
          showToast(error.message, 'error');
        }
      }

      function renderMembers() {
        const card = h('div', { class: 'card' });
        card.append(h('div', { class: 'card-head' },
          h('h3', { text: '成员' }),
          h('span', { class: 'muted', text: `${state.members.length} 人` }),
        ));

        if (!state.members.length) {
          card.append(h('p', { class: 'section-note', text: '暂无成员。' }));
          $('#tab-members').replaceChildren(card);
          return;
        }

        const rows = state.members.map((member) => h('tr', {},
          h('td', {}, h('strong', { text: member.displayName })),
          h('td', { text: member.account }),
          h('td', {}, rolePill(member.role)),
          h('td', { text: fmtTime(member.joinedAt) }),
        ));

        card.append(h('div', { class: 'table-wrap' },
          h('table', { class: 'table' },
            h('thead', {}, h('tr', {}, ...['成员', '账号', '角色', '加入时间'].map((text) => h('th', { text })))),
            h('tbody', {}, ...rows),
          ),
        ));
        card.append(h('p', { class: 'section-note', text: '邀请与角色变更属于 M2 功能，当前版本只读展示。' }));
        $('#tab-members').replaceChildren(card);
      }

      function renderAudit() {
        const card = h('div', { class: 'card' });
        card.append(h('div', { class: 'card-head' },
          h('h3', { text: '审计日志' }),
          h('span', { class: 'muted', text: state.audit ? `${state.audit.length} 条` : '' }),
        ));

        if (state.audit === null) {
          card.append(h('p', { class: 'section-note', text: '仅团队所有者或管理员可以查看审计日志。' }));
          $('#tab-audit').replaceChildren(card);
          return;
        }

        if (!state.audit.length) {
          card.append(h('p', { class: 'section-note', text: '暂无审计记录。' }));
          $('#tab-audit').replaceChildren(card);
          return;
        }

        const rows = state.audit.map((entry) => h('tr', {},
          h('td', { text: fmtTime(entry.at) }),
          h('td', { text: entry.type }),
          h('td', { text: entry.action }),
          h('td', { text: entry.actor?.displayName || '-' }),
          h('td', {}, h('code', { text: JSON.stringify(entry.detail || {}).slice(0, 120) })),
        ));

        card.append(h('div', { class: 'table-wrap' },
          h('table', { class: 'table' },
            h('thead', {}, h('tr', {}, ...['时间', '类型', '操作', '操作人', '详情'].map((text) => h('th', { text })))),
            h('tbody', {}, ...rows),
          ),
        ));
        $('#tab-audit').replaceChildren(card);
      }

      function renderTeam() {
        const team = state.team;
        if (!team) {
          empty.classList.remove('hidden');
          teamView.classList.add('hidden');
          return;
        }
        empty.classList.add('hidden');
        teamView.classList.remove('hidden');
        $('#team-name').textContent = team.name;
        const role = rolePill(team.role);
        role.id = 'team-role';
        $('#team-role').replaceWith(role);
        renderStats(team);
        renderOverview(team);
        renderSnapshots();
        renderMembers();
        renderAudit();
        switchTab(state.tab);
      }

      function switchTab(tab) {
        state.tab = tab;
        for (const button of document.querySelectorAll('#tabs button')) {
          button.classList.toggle('active', button.dataset.tab === tab);
        }
        for (const name of ['overview', 'snapshots', 'members', 'audit']) {
          $('#tab-' + name).classList.toggle('hidden', name !== tab);
        }
      }

      async function selectTeam(id) {
        sessionStorage.setItem(TEAM_KEY, id);
        try {
          const [detail, members, latest, history] = await Promise.all([
            api(`/v1/teams/${id}`),
            api(`/v1/teams/${id}/members`),
            api(`/v1/teams/${id}/snapshots/latest`).catch(() => null),
            api(`/v1/teams/${id}/snapshots?limit=20`),
          ]);
          state.team = detail.team;
          state.members = members.members || [];
          state.latest = latest;
          state.history = history.entries || [];
          state.historyCursor = history.nextCursor;
          state.audit = null;
          state.tab = 'overview';

          if (['owner', 'admin'].includes(state.team.role)) {
            try {
              state.audit = (await api(`/v1/teams/${id}/audit?limit=50`)).entries || [];
            } catch {
              state.audit = null;
            }
          }

          const index = state.teams.findIndex((item) => item.id === id);
          if (index >= 0) state.teams[index] = { ...state.teams[index], ...state.team };
          renderTeamList();
          renderTeam();
        } catch (error) {
          showToast(error.message, 'error');
        }
      }

      async function openPayload(revision) {
        try {
          const payload = await api(`/v1/teams/${state.team.id}/snapshots/${revision}`);
          payloadTitle.textContent = `快照 #${revision}`;
          payloadBody.textContent = JSON.stringify(payload, null, 2).slice(0, 500000);
          payloadDialog.showModal();
        } catch (error) {
          showToast(error.message, 'error');
        }
      }

      async function downloadSnapshot(revision) {
        try {
          const response = await authorizedFetch(`/v1/teams/${state.team.id}/snapshots/${revision}`);
          if (!response.ok) throw new Error('下载失败');
          const blob = await response.blob();
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `inkline-${state.team.name}-r${revision}.json`;
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(link.href), 30000);
        } catch (error) {
          showToast(error.message, 'error');
        }
      }

      async function boot() {
        loadTokens();
        if (!state.access) {
          showLogin();
          return;
        }
        try {
          const me = await api('/v1/me');
          state.me = me.user;
          state.teams = me.teams || [];
          $('#user-label').textContent = `${me.user.displayName} · ${me.user.account}`;
          showApp();
          if (!state.teams.length) {
            renderTeamList();
            state.team = null;
            renderTeam();
            return;
          }
          const saved = sessionStorage.getItem(TEAM_KEY);
          const target = state.teams.find((team) => team.id === saved) || state.teams[0];
          await selectTeam(target.id);
        } catch {
          clearSession();
          showLogin();
        }
      }

      async function handleLogin(event) {
        event.preventDefault();
        const errorBox = $('#login-error');
        const button = $('#login-submit');
        errorBox.textContent = '';
        button.disabled = true;
        try {
          const data = await api('/v1/auth/login', {
            method: 'POST',
            body: JSON.stringify({
              account: $('#account').value.trim(),
              password: $('#password').value,
            }),
          });
          state.access = data.accessToken;
          state.refresh = data.refreshToken;
          saveTokens();
          await boot();
        } catch (error) {
          errorBox.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      }

      async function handleLogout() {
        const refreshToken = state.refresh;
        clearSession();
        showLogin();
        state.team = null;
        state.teams = [];
        sessionStorage.removeItem(TEAM_KEY);
        if (refreshToken) {
          fetch('/v1/auth/logout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ refreshToken }),
          }).catch(() => {});
        }
      }

      async function createTeam(event) {
        event.preventDefault();
        const name = $('#new-team-name').value.trim();
        if (!name) return;
        try {
          const result = await api('/v1/teams', {
            method: 'POST',
            body: JSON.stringify({ name }),
          });
          teamDialog.close();
          $('#new-team-name').value = '';
          await boot();
          showToast('团队已创建');
          await selectTeam(result.team.id);
        } catch (error) {
          showToast(error.message, 'error');
        }
      }

      async function loadMeta() {
        try {
          const meta = await fetch('/v1/meta').then((response) => response.json());
          const text = `${meta.name === 'inkline-team-server' ? 'Inkline 团队服务' : meta.name} · v${meta.version}`;
          $('#login-meta').textContent = text;
          $('#login-foot').textContent = `快照上限 ${Math.round(meta.limits.maxUncompressedBytes / 1024 / 1024)} MB · 保留 ${meta.retention.snapshotDays} 天`;
          $('#server-meta').textContent = text;
        } catch {
          // 元信息不可用时不影响登录。
        }
      }

      $('#login-form').addEventListener('submit', handleLogin);
      $('#logout').addEventListener('click', handleLogout);
      $('#refresh').addEventListener('click', boot);
      $('#new-team').addEventListener('click', () => teamDialog.showModal());
      $('#team-cancel').addEventListener('click', () => teamDialog.close());
      $('#team-form').addEventListener('submit', createTeam);
      $('#payload-close').addEventListener('click', () => payloadDialog.close());
      payloadDialog.addEventListener('click', (event) => {
        if (event.target === payloadDialog) payloadDialog.close();
      });

      for (const button of document.querySelectorAll('#tabs button')) {
        button.addEventListener('click', () => switchTab(button.dataset.tab));
      }

      loadMeta();
      boot();
    })();
  </script>
</body>
</html>
